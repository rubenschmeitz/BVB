name: Website development checks
on:
  pull_request:
  push:
    branches: [main, codex/cloud-environment]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: bash scripts/setup.sh
      - run: node node_modules/playwright/cli.js install-deps chromium
      - run: .venv/bin/python -c "import PIL, numpy, cv2"
      - run: npm run check
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-checks
          path: .artifacts/
