name: Website controleren

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Inhoud, techniek en visuele gelijkheid
    # De referentiebeelden zijn met de vaste Windows/Chromium-combinatie
    # opgenomen. Linux gebruikt andere font-rasterisatie en zou daardoor
    # platformruis als een visuele regressie aanmerken.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js 24 instellen
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Vaste afhankelijkheden installeren
        run: npm ci

      - name: Vaste Chromium-versie installeren
        run: npx playwright install chromium

      - name: Bouw, inhoud, HTML, links en toegankelijkheid controleren
        run: npm run check

      - name: Interactietests uitvoeren
        run: npm run test:e2e

      - name: Visuele vergelijking uitvoeren
        run: npm run test:visual

      - name: Lighthouse-grenzen controleren
        run: npm run test:lighthouse

      - name: Testrapport bewaren bij een fout
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: website-testresultaten
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
